<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; background: transparent; font: 13px/1.4 "Segoe UI", sans-serif; color: #e8e2d0; user-select: none; overflow: hidden; }
  .card { margin: 4px; padding: 10px 12px; background: rgba(18, 14, 10, 0.95); border: 1px solid #6b5a3a; border-radius: 6px; }
  .name { font-size: 15px; font-weight: 600; }
  .Unique { color: #d98a3d; } .Rare { color: #e8d36a; } .Magic { color: #8888ff; }
  .Gem { color: #1ba29b; } .Currency { color: #c9b98b; } .Divination { color: #bfe3f5; }
  .meta { color: #9a8f78; font-size: 12px; margin-top: 2px; }
  .price { font-size: 20px; margin-top: 8px; }
  .sub { color: #b8ad92; }
  .low { color: #e0a050; font-size: 12px; }
  .err { color: #e06060; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button { flex: 1; background: #3a2f1f; color: #e8e2d0; border: 1px solid #6b5a3a; border-radius: 4px; padding: 5px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled) { background: #4d3e28; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: #5a4520; border-color: #a3854a; font-weight: 600; }

  /* mod picker */
  .section { margin-top: 10px; color: #9a8f78; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; }
  .mods { margin-top: 4px; }
  .mod { display: grid; grid-template-columns: 18px 22px 1fr 46px 46px; align-items: center; gap: 4px; padding: 2px 0; cursor: pointer; }
  .mod.off .text { color: #8a8170; }
  .mod.na { opacity: 0.45; cursor: default; }
  .mod input[type=checkbox] { margin: 0; accent-color: #c9a45a; }
  .tag { font-size: 10px; text-align: center; border-radius: 3px; padding: 0 2px; color: #18120c; font-weight: 700; }
  .tag.pseudo { background: #c9a45a; } .tag.implicit { background: #8fa6c9; } .tag.explicit { background: #8a8170; }
  .tag.crafted { background: #b8d8f8; } .tag.fractured { background: #a29162; } .tag.enchant { background: #b4b4ff; }
  .text { font-size: 12.5px; }
  .tier { color: #7d735f; font-size: 11px; margin-left: 4px; }
  input.num { width: 100%; box-sizing: border-box; background: #120e0a; color: #e8e2d0; border: 1px solid #4a3e2a; border-radius: 3px; padding: 1px 3px; font: inherit; font-size: 12px; text-align: right; }
  input.num::placeholder { color: #5a5040; }
  input.num::-webkit-inner-spin-button { display: none; }
  .opts { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; color: #b8ad92; }
  input[type=checkbox] { accent-color: #c9a45a; }
  .opts label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .opts input.num { width: 42px; }
  .hint { color: #7d735f; font-size: 11px; margin-top: 4px; }

  /* results */
  .status { margin-top: 8px; font-size: 12px; min-height: 16px; }
  .summary { font-size: 18px; margin-top: 6px; }
  .listings { margin-top: 4px; max-height: 260px; overflow-y: auto; }
  .listing { display: grid; grid-template-columns: 10px 1fr 52px 44px; gap: 6px; font-size: 12px; padding: 1px 0; border-bottom: 1px solid rgba(107, 90, 58, 0.25); }
  .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; }
  .dot.online { background: #5fbf5f; } .dot.afk { background: #d0a040; } .dot.offline { background: #666; }
  .age, .ilvl { color: #9a8f78; text-align: right; }
  .spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid #6b5a3a; border-top-color: #e8d36a; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card" id="card"><div class="meta">Hover an item in game and press Ctrl+C (Ctrl+Alt+C shows roll ranges).</div></div>
  <script src="renderer.js"></script>
</body>
</html>
